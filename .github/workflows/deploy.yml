name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Diagnose environment
        run: |
          node --version
          npm --version
          echo "registry=$(npm config get registry)"
          ls -la package.json package-lock.json 2>/dev/null || true

      - name: Clean legacy lock
        run: rm -f package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          CI: true

      - name: Verify installation
        run: |
          ls -la node_modules/.bin/vite
          test -f package-lock.json && echo "lock_generated=true" || echo "lock_generated=false"

      - name: Build
        run: npm run build
        env:
          CI: true
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
